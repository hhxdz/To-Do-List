<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do List</title>
    
</head>
<body>
    <div class="modal-bg">

    </div>
    <div class="change-bg-modal modal" style="display: none;">
        <div class="change-bg-container">
             <div class="top-panel">
                <h3>Change background</h3>
                <button class="close-modal-btn" onclick="closeAllModals()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
        </div>
        <div class="default-bg-types">
            <div class="type-container">
                <img src="./images/photos-opt.jpg" alt="photos" class="bg-type-img">
                <p>Photos</p>
            </div>
            <div class="type-container">
                <img src="./images/color-gradient.jpg" alt="color gradient" class="bg-type-img">
                <p>Colors</p>
            </div>
        </div>
        <hr class="modal-line">
            <h4>Custom</h4>
            <input type="file" accept="image/*" id="bg-img-inp" hidden>
            <button class="bg-type-img bg-custom-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </button>
    </div>


    <div class="container">
        <header class="header">
            <div class="header-text">
                <h1>My Tasks</h1>
                <p class="subtitle">Task List</p>
            </div>
            <button class="change-bg-btn open-modal-btn header-btn" data-modal-class="change-bg-modal">
                <svg  xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wallpaper-icon lucide-wallpaper"><path d="M12 17v4"/><path d="M8 21h8"/><path d="m9 17 6.1-6.1a2 2 0 0 1 2.81.01L22 15"/><circle cx="8" cy="9" r="2"/><rect x="2" y="3" width="20" height="14" rx="2"/></svg>
            </button>
            
        </header>

        <div class="add-task-section">
            <form id="task-form" class="task-form">
                <div class="form-group">
                    <input type="text"
                        id="task-title"
                        placeholder="Task name"
                        required
                        maxlength="100">
                </div>
                <div class="form-group">
                    <textarea id="task-description"
                        placeholder="Description (not required)"
                        maxlength="300"
                        rows="3">
                    </textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="task-date">Date</label>
                        <input type="date" id="task-date" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="create-task-btn">Create task</button>
                <button type="button" id="cancel-editing" class="btn btn-primary" style="display: none;">Cancel changes</button>
            </form>
        </div>

        <div class="controls">
            <div class="filter-section">
                <label>Filter by priority</label>
                <div class="filter-buttons">
                    <div class="filter-btn active" data-filter="all">All</div>
                    <div class="filter-btn" data-filter="high">high</div>
                    <div class="filter-btn" data-filter="medium">medium</div>
                    <div class="filter-btn"data-filter="low">low</div>
                </div>
            </div>
            <div class="sort-section">
                <label for="sort-by">Sort by</label>
                <select name="sort-by" id="sort-by">
                    <option value="default">Default</option>
                    <option value="priority">Priority</option>
                    <option value="date">Date</option>
                </select>
            </div>
        </div>

        <div id="task-list" class="task-list">
            <div class="empty-state" id="empty-state">
                <p>No tasks. Create a new tas</p>
            </div>

            <div class="task-card priority-low">
                <div class="task-header">
                    <div>
                        <h3 class="task-title">Do homework</h3>
                        <span class="task-priority priority-low"></span>
                    </div>
                    <p class="task-description">Do math homework</p>
                    <div class="task-meta">
                        <div class="task-data">
                            <span>Date: 12/12/2026</span>
                        </div>
                        <div class="task-data">
                            <span>Created: 30/08/2026</span>
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="edit-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
                        </button>
                        <button class="delete-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="./app.js"></script>
</body>
</html>
